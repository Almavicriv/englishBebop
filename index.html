<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>אנגלית תעופתית — אימון פקחים ובקרים</title>
  <meta name="description" content="אפליקציית אימון אנגלית מבצעית לפקחי ובקרי טיסה.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ============================================================
    // 🔧 הכנס כאן את הפרטים שלך מ-Firebase Console
    // ============================================================
    const firebaseConfig = {
      apiKey:            "REPLACE_API_KEY",
      authDomain:        "REPLACE_AUTH_DOMAIN",
      projectId:         "REPLACE_PROJECT_ID",
      storageBucket:     "REPLACE_STORAGE_BUCKET",
      messagingSenderId: "REPLACE_MESSAGING_SENDER_ID",
      appId:             "REPLACE_APP_ID"
    };
    // ============================================================

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getFirestore(app);
    const provider = new GoogleAuthProvider();

    /* --- שמירה ב-Firestore --- */
    async function saveProgress(uid, data) {
      try {
        await setDoc(doc(db, 'users', uid), data, { merge: true });
      } catch(e) { console.warn('saveProgress error', e); }
    }

    /* --- טעינה מ-Firestore --- */
    async function loadProgress(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        return snap.exists() ? snap.data() : null;
      } catch(e) { return null; }
    }

    /* --- כניסה עם גוגל --- */
    async function googleSignIn() {
      try {
        const result = await signInWithPopup(auth, provider);
        return result.user;
      } catch(e) {
        console.error('Google sign-in error', e);
        return null;
      }
    }

    /* --- יציאה --- */
    async function firebaseSignOut() {
      await signOut(auth);
    }

    /* --- חשיפה לאפליקציה הראשית --- */
    window.__ATC_FIREBASE__ = { googleSignIn, firebaseSignOut, saveProgress, loadProgress, onAuthStateChanged, auth };

    /* --- מאזין לשינוי מצב כניסה --- */
    onAuthStateChanged(auth, (user) => {
      if (window.__ATC_AUTH_CALLBACK__) window.__ATC_AUTH_CALLBACK__(user);
    });
  </script>
</head>
<body>
  <div class="omstage">
    <div id="app" dir="rtl" class="omframe"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
